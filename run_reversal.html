<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behaviour Heatmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ledger-style strip chart. Header with the rule as plain terms, a summary row, then one
   horizontal strip per stock (ticker + average on the left, months running right). */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #18222e;
  --muted: #5f6c7b;
  --line: #d8dee5;
  --accent: #2b5d8a;
  --gain: #0f7a6c;
  --loss: #b8432f;
  --zero: #e6e9ed;
  --idle: #eef1f4;
  --focus: #2b5d8a;
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cell: 13px;
  --label: 196px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #18202a; --ink: #e3e8ee; --muted: #93a0ae; --line: #2a3542;
    --accent: #7fb0dc; --gain: #3fbfa8; --loss: #e27a63; --zero: #27313d; --idle: #1c242e; --focus: #7fb0dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #18202a; --ink: #e3e8ee; --muted: #93a0ae; --line: #2a3542;
  --accent: #7fb0dc; --gain: #3fbfa8; --loss: #e27a63; --zero: #27313d; --idle: #1c242e; --focus: #7fb0dc;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
}
.page {
  max-width: 1280px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 22px;
}
header { display: grid; gap: 10px; }
.eyebrow {
  font: 500 11px/1 var(--font-data);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(26px, 4vw, 36px);
  line-height: 1.1;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.rule { margin: 0; max-width: 68ch; color: var(--muted); }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term {
  font: 500 12px/1 var(--font-data);
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface);
}
.term b { font-weight: 500; color: var(--accent); }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font: 500 20px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.setting { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); }
.setting .k { font-size: 13px; font-weight: 600; }
.setting label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.setting input[type="range"] { width: 160px; accent-color: var(--accent); }
.setting output { font: 500 13px var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 48px; }
.setting .status { font: 12px var(--font-data); color: var(--muted); }
select, button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 6px 10px;
  cursor: pointer;
}
select:focus-visible, button:focus-visible, .row:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.legend { display: flex; align-items: center; gap: 8px; font: 12px var(--font-data); color: var(--muted); margin-left: auto; }
.legend .ramp { width: 160px; height: 10px; border-radius: 2px; }
.legend .swatch { width: 12px; height: 10px; background: var(--idle); border: 1px dashed var(--line); }

.chart { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); }
.grid { display: grid; min-width: max-content; padding-block: 8px 10px; }
.row {
  display: grid;
  grid-template-columns: var(--label) repeat(var(--months), var(--cell));
  column-gap: 1px;
  align-items: center;
  height: calc(var(--cell) + 1px);
}
.row.axis { height: 22px; align-items: end; }
.lab {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--surface);
  height: 100%;
  display: grid;
  grid-template-columns: 1fr auto 3.2em;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 12px;
  font: 500 11px/1 var(--font-data);
  font-variant-numeric: tabular-nums;
  border-right: 1px solid var(--line);
}
.lab .tk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lab .open { color: var(--loss); }
.lab .avg, .lab .tpm { text-align: right; }
.lab .tpm { color: var(--muted); }
.cell { height: var(--cell); border-radius: 1px; }
.cell.idle { background: var(--idle); }
.year { font: 10px/1 var(--font-data); color: var(--muted); border-left: 1px solid var(--line); padding-left: 3px; white-space: nowrap; }
.row:hover .lab, .row:focus-visible .lab { color: var(--accent); }
.row:hover .cell { filter: saturate(1.15); }
.cell:hover { outline: 1px solid var(--ink); outline-offset: 0; }

.tip {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  background: var(--ink);
  color: var(--bg);
  padding: 8px 10px;
  border-radius: 3px;
  font: 12px/1.45 var(--font-data);
  font-variant-numeric: tabular-nums;
  max-width: 260px;
}
.tip strong { font-family: var(--font-ui); font-weight: 600; }
.notes { color: var(--muted); font-size: 13px; max-width: 75ch; display: grid; gap: 6px; }
.notes p { margin: 0; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.mode button { border: 0; border-radius: 0; background: var(--surface); color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lab { cursor: pointer; }
.row.sel .lab { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--surface)); }
.detail { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px 10px; display: grid; gap: 8px; }
.detail .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.detail h2 { margin: 0; font-size: 18px; font-weight: 800; }
.detail .sub { color: var(--muted); font-size: 13px; }
.detail .close { margin-left: auto; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 12px var(--font-data); font-variant-numeric: tabular-nums; }
.keys i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.plot { width: 100%; height: auto; display: block; touch-action: none; }
.plot text { font: 11px var(--font-data); fill: var(--muted); }
.plot .gridline { stroke: var(--line); stroke-width: 1; }
.plot .one { stroke: var(--muted); stroke-dasharray: 3 3; }
.plot .bot { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.plot .stk { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.plot .cross { stroke: var(--ink); stroke-width: 1; opacity: .4; }
.combo { overflow-x: auto; }
.combo table { border-collapse: separate; border-spacing: 2px; font: 11px var(--font-data); font-variant-numeric: tabular-nums; }
.combo th { font-weight: 500; color: var(--muted); padding: 2px 6px; white-space: nowrap; }
.combo td { width: 54px; height: 30px; text-align: center; border-radius: 2px; cursor: pointer; color: var(--ink); }
.combo td:hover { outline: 1px solid var(--ink); }
.combo td.sel { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 500; }
.combo td.def { box-shadow: inset 0 0 0 1px var(--muted); }
.combo td:focus-visible { outline: 2px solid var(--focus); }
.combo .axis-title { color: var(--muted); font: 12px var(--font-ui); text-align: left; padding: 0 0 4px; }
@media (max-width: 520px) {
  :root { --label: 158px; }
  .legend { margin-left: 0; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">Behaviour backtest · Massive 1m bars · xyz stocks</div>
    <h1 id="title"></h1>
    <p class="rule" id="rule"></p>
    <div class="terms" id="terms"></div>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <div class="setting">
    <span class="k">Heatmap setting</span>
    <label for="ax0"><span id="ax0-l"></span> <input type="range" id="ax0" min="0" step="1"> <output id="ax0-v" for="ax0"></output></label>
    <label for="ax1"><span id="ax1-l"></span> <input type="range" id="ax1" min="0" step="1"> <output id="ax1-v" for="ax1"></output></label>
    <span class="status" id="set-status" aria-live="polite"></span>
  </div>

  <div class="controls">
    <label for="sort">Sort rows by
      <select id="sort">
        <option value="avg">Average monthly return</option>
        <option value="total">Total return</option>
        <option value="worst">Worst month</option>
        <option value="tpm">Trades per month</option>
        <option value="ticker">Ticker</option>
      </select>
    </label>
    <button id="dir" type="button" aria-label="Reverse sort order">Highest first</button>
    <div class="mode" role="group" aria-label="Return shown">
      <button id="mode-rel" type="button" aria-pressed="true">vs stock</button>
      <button id="mode-abs" type="button" aria-pressed="false">absolute</button>
    </div>
    <div class="legend" aria-hidden="true">
      <span id="lo"></span><span class="ramp" id="ramp"></span><span id="hi"></span>
      <span class="swatch"></span><span>idle month</span>
    </div>
  </div>

  <div class="chart"><div class="grid" id="grid"></div></div>

  <section class="detail" id="stock-panel" hidden aria-live="polite">
    <div class="top">
      <h2 id="s-title"></h2><span class="sub" id="s-sub"></span>
      <button class="close" id="s-close" type="button">Close</button>
    </div>
    <div class="keys" id="s-keys"></div>
    <div class="combo" id="combo"></div>
  </section>

  <section class="detail" id="detail" hidden aria-live="polite">
    <div class="top">
      <h2 id="d-title"></h2><span class="sub" id="d-sub"></span>
      <button class="close" id="d-close" type="button">Close</button>
    </div>
    <div class="keys" id="d-keys"></div>
    <svg class="plot" id="plot" viewBox="0 0 900 320" role="img" aria-label="Growth of 1 dollar, bot vs stock"></svg>
  </section>

  <div class="notes" id="notes"></div>
</div>
<div class="tip" id="tip" hidden></div>

const pct = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x * 100).toFixed(d) + "%";
const fmtMonth = m => new Date(m + "-01T00:00:00Z").toLocaleString("en", { month: "short", year: "numeric", timeZone: "UTC" });
const fmtDay = d => new Date(d * 864e5).toLocaleDateString("en", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
// The behaviour describes itself: two grid axes (rows, columns), its rule and its wording.
// {0} and {1} in its texts stand for the current row and column value.
const SPEC = DATA.spec, AX = SPEC.axes, WORDS = SPEC.words;
const ROWS = AX[0].values, COLS = AX[1].values, NC = COLS.length;
let cur = [...SPEC.default];  // [row, column] index of the heatmap setting
const axFull = (a, i) => (+AX[a].values[i]).toFixed(AX[a].decimals) + AX[a].unit;
const axShort = (a, i) => AX[a].values[i] + AX[a].unit;
const settingName = k => `${AX[0].name} ${axShort(0, Math.floor(k / NC))} / ${AX[1].name} ${axShort(1, k % NC)}`;
const fillIn = text => text.replace(/\{([01])\}/g, (_, a) => axFull(+a, cur[+a]));
document.title = DATA.strategy + " Heatmap";
document.getElementById("title").textContent = DATA.strategy;

function renderTerms() {
document.getElementById("rule").textContent = fillIn(SPEC.rule) +
  ` "vs stock" divides the bot's growth by the ` +
  `stock's own growth over the same month: +3% while the stock made +6% shows as −2.8%. The heatmap uses one ` +
  `setting; click a stock to compare all ${ROWS.length * NC} ${AX[0].name}/${AX[1].name} settings for it, then a setting for its chart.`;
document.getElementById("terms").innerHTML = [
  ...SPEC.terms.map(([k, v]) => [k, fillIn(v)]),
  ["sizing", "all in"],
  ["fees", "0"],
  ["prices", "split-adjusted, incl. pre/post market"],
].map(([k, v]) => `<span class="term">${k} <b>${v}</b></span>`).join("");
}
renderTerms();

// Shared month axis across all stocks
const months = [...new Set(DATA.rows.flatMap(r => r.months.map(m => m.m)))].sort();
const monthIndex = Object.fromEntries(months.map((m, i) => [m, i]));
document.documentElement.style.setProperty("--months", months.length);

// Both views precomputed: abs = bot's own return, rel = bot growth / stock growth - 1
const rel = (bot, stock) => (1 + bot) / (1 + stock) - 1;
const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
function prepare(r) {
  r.byMonth = Object.fromEntries(r.months.map(m => [m.m, m]));
  for (const m of r.months) m.rel = rel(m.r, m.s);
  r.abs = { avg: r.avg, total: r.total, worst: Math.min(...r.months.map(m => m.r)) };
  r.rel = { avg: mean(r.months.map(m => m.rel)), total: rel(r.total, r.stock_total),
            worst: Math.min(...r.months.map(m => m.rel)) };
}
DATA.rows.forEach(prepare);

let mode = "rel", sortKey = "avg", desc = true, selected = null, CAP = 0.1;
const val = m => (mode === "rel" ? m.rel : m.r);
// Trades per month: round trips started per calendar month the stock was in the data
const tpm = r => r.trades / r.months.length;
const stat = (r, k) => (k === "tpm" ? tpm(r) : r[mode][k]);

function color(x) {
  const t = Math.min(Math.abs(x) / CAP, 1);
  return `color-mix(in oklab, var(${x >= 0 ? "--gain" : "--loss"}) ${Math.round(Math.sqrt(t) * 100)}%, var(--zero))`;
}

function summary() {
  // Colour scale: clip at a round number near the 95th percentile of |monthly value|
  const abs = DATA.rows.flatMap(r => r.months.map(m => Math.abs(val(m)))).sort((a, b) => a - b);
  const p95 = abs[Math.floor(abs.length * 0.95)] || 0.01;
  CAP = [0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5].find(c => c >= p95) || 0.5;
  document.getElementById("lo").textContent = pct(-CAP, 0);
  document.getElementById("hi").textContent = pct(CAP, 0);

  const avgs = DATA.rows.map(r => r[mode].avg).sort((a, b) => a - b);
  const best = DATA.rows.reduce((a, b) => (b[mode].avg > a[mode].avg ? b : a));
  const label = mode === "rel" ? "vs stock" : "absolute";
  document.getElementById("stats").innerHTML = [
    ["Stocks", DATA.rows.length],
    ["Months", `${fmtMonth(months[0])} – ${fmtMonth(months.at(-1))}`],
    [`Median avg / month, ${label}`, pct(avgs[Math.floor(avgs.length / 2)], 2)],
    [`Positive avg, ${label}`, `${avgs.filter(a => a > 0).length} of ${DATA.rows.length}`],
    ["Beat the stock overall", `${DATA.rows.filter(r => r.rel.total > 0).length} of ${DATA.rows.length}`],
    [`Best avg / month, ${label}`, `${best.ticker} ${pct(best[mode].avg, 2)}`],
    [WORDS.open_stat, `${DATA.rows.filter(r => r.open).length} stocks`],
  ].map(([k, v]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
}

document.getElementById("notes").innerHTML = `
  <p>Rows marked <span style="color:var(--loss)">●</span> ${WORDS.open_note}</p>
  <p>Generated ${DATA.generated}. No commissions, spread or slippage, and ${WORDS.fills},
  so real results would be lower. Source: Massive 1-minute bars for the US-listed
  companies with a market on Hyperliquid's xyz DEX.</p>`;

// Heatmap
const grid = document.getElementById("grid");
const tip = document.getElementById("tip");

function axisRow() {
  const row = document.createElement("div");
  row.className = "row axis";
  row.innerHTML = `<div class="lab"><span class="tk" style="color:var(--muted)">Ticker</span><span class="avg" style="color:var(--muted)">avg/mo</span><span class="tpm" title="trades per month">tr/mo</span></div>`;
  months.forEach((m, i) => {
    if (m.endsWith("-01") || i === 0) {
      const el = document.createElement("div");
      el.className = "year";
      el.textContent = m.slice(0, 4);
      el.style.gridColumn = `${i + 2} / span ${Math.min(12, months.length - i)}`;
      row.appendChild(el);
    }
  });
  return row;
}

function render() {
  summary();
  const rows = [...DATA.rows].sort((a, b) => {
    if (sortKey === "ticker") return desc ? a.ticker.localeCompare(b.ticker) : b.ticker.localeCompare(a.ticker);
    const v = stat(a, sortKey) - stat(b, sortKey);
    return desc ? -v : v;
  });
  const frag = document.createDocumentFragment();
  frag.appendChild(axisRow());
  for (const r of rows) {
    const avg = r[mode].avg;
    const row = document.createElement("div");
    row.className = r.ticker === selected ? "row sel" : "row";
    row.tabIndex = 0;
    row.dataset.ticker = r.ticker;
    row.setAttribute("aria-label", `${r.ticker}: average ${pct(avg, 2)} a month. Press Enter for its history.`);
    const lab = document.createElement("div");
    lab.className = "lab";
    lab.title = (r.name || r.ticker) + " · click for full history";
    lab.innerHTML = `<span class="tk">${r.ticker}${r.open ? ' <span class="open">●</span>' : ""}</span>` +
      `<span class="avg" style="color:${avg >= 0 ? "var(--gain)" : "var(--loss)"}">${pct(avg, 2)}</span>` +
      `<span class="tpm">${tpm(r) < 10 ? tpm(r).toFixed(1) : Math.round(tpm(r))}</span>`;
    row.appendChild(lab);
    for (const m of r.months) {
      const c = document.createElement("div");
      const idle = mode === "abs" && m.r === 0 && !m.p && !m.e && !m.x;
      c.className = idle ? "cell idle" : "cell";
      if (!idle) c.style.background = color(val(m));
      c.style.gridColumn = monthIndex[m.m] + 2;
      c.dataset.m = m.m;
      row.appendChild(c);
    }
    frag.appendChild(row);
  }
  grid.replaceChildren(frag);
  document.getElementById("dir").textContent =
    sortKey === "ticker" ? (desc ? "A to Z" : "Z to A") : (desc ? "Highest first" : "Lowest first");
}

function showTip(e) {
  const cell = e.target.closest(".cell");
  if (!cell) { tip.hidden = true; return; }
  const r = DATA.rows.find(x => x.ticker === cell.parentElement.dataset.ticker);
  const m = r.byMonth[cell.dataset.m];
  tip.innerHTML = `<strong>${r.ticker}</strong> · ${fmtMonth(m.m)}<br>` +
    `bot ${pct(m.r, 2)} · stock ${pct(m.s, 1)}<br>` +
    `vs stock ${pct(m.rel, 2)}<br>` +
    `${m.e} ${WORDS.in} · ${m.x} ${WORDS.out} · ${WORDS.pos[m.p]} at month end`;
  tip.hidden = false;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.min(e.clientX + pad, window.innerWidth - w - 8);
  const y = e.clientY + pad + h > window.innerHeight ? e.clientY - h - pad : e.clientY + pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}

// Stock panel: every setting of the grid for one stock; chart: one setting over time
let DEFAULT = cur[0] * NC + cur[1];
const plot = document.getElementById("plot");
const W = 900, H = 320, L = 52, R = 14, T = 12, B = 28;
let combo = null;  // selected setting index in the open stock

function loadStock(ticker) {
  const store = window[SPEC.global + "_STOCK"] = window[SPEC.global + "_STOCK"] || {};
  if (store[ticker]) return Promise.resolve(store[ticker]);
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = `${SPEC.dir}/${encodeURIComponent(ticker)}.js`;
    el.onload = () => resolve(store[ticker]);
    el.onerror = () => reject(new Error(`${SPEC.dir}/${ticker}.js is missing next to this page`));
    document.head.appendChild(el);
  });
}

// cells[i] = [avg/mo absolute, avg/mo vs stock, total, total vs stock, trades, unrealized or null]
const cellVal = c => (mode === "rel" ? c[1] : c[0]);

function renderStock() {
  const S = window[SPEC.global + "_STOCK"]?.[selected];
  if (!selected || !S) return;
  const r = DATA.rows.find(x => x.ticker === selected);
  const vals = S.cells.map(cellVal);
  const cap = Math.max(...vals.map(Math.abs)) || 0.01;
  const best = vals.indexOf(Math.max(...vals));
  const label = mode === "rel" ? "vs stock" : "absolute";
  document.getElementById("s-title").textContent = r.ticker;
  document.getElementById("s-sub").textContent = `${r.name || ""} · average monthly return ${label}, per setting`;
  document.getElementById("s-keys").innerHTML =
    `<span>best: ${settingName(best)} → ${pct(vals[best], 2)}/mo</span>` +
    `<span>outlined: heatmap setting (${settingName(DEFAULT)})</span>` +
    `<span>click a square for its chart</span>`;
  let html = `<table><caption class="axis-title">${SPEC.caption}</caption>` +
    `<tr><th>${AX[0].name} \\ ${AX[1].name}</th>${COLS.map((_, j) => `<th>${axShort(1, j)}</th>`).join("")}</tr>`;
  ROWS.forEach((_, i) => {
    html += `<tr><th>${axShort(0, i)}</th>`;
    COLS.forEach((_, j) => {
      const k = i * NC + j, v = vals[k];
      const t = Math.min(Math.abs(v) / cap, 1);
      const bg = `color-mix(in oklab, var(${v >= 0 ? "--gain" : "--loss"}) ${Math.round(Math.sqrt(t) * 100)}%, var(--zero))`;
      const cls = [k === combo ? "sel" : "", k === DEFAULT ? "def" : ""].join(" ").trim();
      html += `<td tabindex="0" data-k="${k}" class="${cls}" style="background:${bg}" ` +
        `title="${settingName(k)} · ${pct(v, 2)}/mo · ${S.cells[k][4]} trades">${(v * 100).toFixed(1)}</td>`;
    });
    html += "</tr>";
  });
  document.getElementById("combo").innerHTML = html + "</table>";
}

async function openStock(ticker) {
  selected = ticker;
  combo = null;
  document.getElementById("detail").hidden = true;
  render();
  const panel = document.getElementById("stock-panel");
  panel.hidden = false;
  document.getElementById("s-title").textContent = ticker;
  document.getElementById("s-sub").textContent = "loading…";
  document.getElementById("combo").innerHTML = "";
  try {
    await loadStock(ticker);
  } catch (e) {
    document.getElementById("s-sub").textContent = e.message;
    return;
  }
  if (selected !== ticker) return;
  renderStock();
  panel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function openCombo(k) {
  combo = k;
  renderStock();
  const r = DATA.rows.find(x => x.ticker === selected);
  const S = window[SPEC.global + "_STOCK"][selected];
  const c = S.cells[k], eq = S.curves[k], st = S.stock, days = S.days;
  const d = days.map((day, i) => [day, eq[i], st[i]]);
  document.getElementById("d-title").textContent = `${r.ticker} · ${settingName(k)}`;
  document.getElementById("d-sub").textContent = `${fmtDay(days[0])} to ${fmtDay(days.at(-1))}`;
  document.getElementById("d-keys").innerHTML =
    `<span><i style="background:var(--accent)"></i>bot ${eq.at(-1).toFixed(2)}× (${pct(c[2])})</span>` +
    `<span><i style="background:var(--muted)"></i>stock ${st.at(-1).toFixed(2)}× (${pct(r.stock_total)})</span>` +
    `<span>bot vs stock ${pct(c[3])}</span><span>${c[4]} trades</span>` +
    (c[5] !== null ? `<span style="color:var(--loss)">${WORDS.held}, ${pct(c[5])} unrealized</span>` : "") +
    `<span id="d-hover"></span>`;

  const vals = d.flatMap(p => [p[1], p[2]]).filter(v => v > 0);
  let lo = Math.log(Math.min(...vals, 1)), hi = Math.log(Math.max(...vals, 1));
  if (hi - lo < 0.2) { lo -= 0.1; hi += 0.1; }
  const x0 = d[0][0], x1 = d.at(-1)[0];
  const X = day => L + (day - x0) / Math.max(1, x1 - x0) * (W - L - R);
  const Y = v => T + (hi - Math.log(Math.max(v, 1e-6))) / (hi - lo) * (H - T - B);

  const ticks = [];
  for (let e = Math.floor(lo / Math.LN10) - 1; e <= Math.ceil(hi / Math.LN10); e++)
    for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (Math.log(v) >= lo && Math.log(v) <= hi) ticks.push(v); }
  const fmtX = v => (v >= 1 ? +v.toFixed(0) : +v.toPrecision(1)) + "×";
  let svg = ticks.map(v => `<line class="gridline${v === 1 ? " one" : ""}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>` +
    `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmtX(v)}</text>`).join("");
  for (let y = new Date(x0 * 864e5).getUTCFullYear() + 1; y <= new Date(x1 * 864e5).getUTCFullYear(); y++) {
    const day = Date.UTC(y, 0, 1) / 864e5;
    svg += `<line class="gridline" x1="${X(day)}" x2="${X(day)}" y1="${T}" y2="${H - B}"/>` +
      `<text x="${X(day)}" y="${H - 8}" text-anchor="middle">${y}</text>`;
  }
  const path = j => "M" + d.map(p => `${X(p[0]).toFixed(1)},${Y(p[j]).toFixed(1)}`).join("L");
  svg += `<path class="stk" d="${path(2)}"/><path class="bot" d="${path(1)}"/>` +
    `<line class="cross" id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>`;
  plot.innerHTML = svg;
  plot.onpointermove = e => {
    const box = plot.getBoundingClientRect();
    const day = x0 + ((e.clientX - box.left) / box.width * W - L) / (W - L - R) * (x1 - x0);
    let i = d.findIndex(p => p[0] >= day); if (i < 0) i = d.length - 1;
    const p = d[i], cross = document.getElementById("cross");
    cross.setAttribute("x1", X(p[0])); cross.setAttribute("x2", X(p[0])); cross.setAttribute("visibility", "visible");
    document.getElementById("d-hover").textContent = `${fmtDay(p[0])}: bot ${p[1].toFixed(3)}× · stock ${p[2].toFixed(3)}×`;
  };
  plot.onpointerleave = () => {
    document.getElementById("cross").setAttribute("visibility", "hidden");
    document.getElementById("d-hover").textContent = "";
  };
  const panel = document.getElementById("detail");
  panel.hidden = false;
  panel.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

grid.addEventListener("pointermove", showTip);
grid.addEventListener("pointerleave", () => { tip.hidden = true; });
grid.addEventListener("click", e => { const row = e.target.closest(".row:not(.axis)"); if (row) { tip.hidden = true; openStock(row.dataset.ticker); } });
grid.addEventListener("keydown", e => { const row = e.target.closest(".row:not(.axis)"); if (row && e.key === "Enter") openStock(row.dataset.ticker); });
const comboEl = document.getElementById("combo");
comboEl.addEventListener("click", e => { const td = e.target.closest("td[data-k]"); if (td) openCombo(+td.dataset.k); });
comboEl.addEventListener("keydown", e => { const td = e.target.closest("td[data-k]"); if (td && e.key === "Enter") openCombo(+td.dataset.k); });
document.getElementById("s-close").addEventListener("click", () => {
  document.getElementById("stock-panel").hidden = true;
  document.getElementById("detail").hidden = true;
  selected = null; combo = null; render();
});
document.getElementById("d-close").addEventListener("click", () => { document.getElementById("detail").hidden = true; combo = null; renderStock(); });

document.getElementById("sort").addEventListener("change", e => {
  sortKey = e.target.value;
  desc = sortKey !== "ticker";
  render();
});
document.getElementById("dir").addEventListener("click", () => { desc = !desc; render(); });
for (const m of ["rel", "abs"]) {
  document.getElementById("mode-" + m).addEventListener("click", () => {
    mode = m;
    document.getElementById("mode-rel").setAttribute("aria-pressed", m === "rel");
    document.getElementById("mode-abs").setAttribute("aria-pressed", m === "abs");
    render();
    renderStock();
  });
}
// Ranking sliders: swap every stock's months for another setting, loaded from its own file
// Each slider moves over its axis's value indices
const sliders = [0, 1].map(a => document.getElementById("ax" + a));
const setStatus = document.getElementById("set-status");
sliders.forEach((el, a) => {
  el.max = AX[a].values.length - 1;
  el.value = cur[a];
  document.getElementById(`ax${a}-l`).textContent = AX[a].label;
});
function showSliders() {
  sliders.forEach((el, a) => { document.getElementById(`ax${a}-v`).textContent = AX[a].sign + axFull(a, +el.value); });
}
function loadSetting(k) {
  const store = window[SPEC.global + "_SETTING"] = window[SPEC.global + "_SETTING"] || {};
  if (store[k]) return Promise.resolve(store[k]);
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = `${SPEC.dir}/setting_${k}.js`;
    el.onload = () => resolve(store[k]);
    el.onerror = () => reject(new Error(`${SPEC.dir}/setting_${k}.js is missing next to this page`));
    document.head.appendChild(el);
  });
}
let settingRequest = 0;
async function applySetting() {
  const k = +sliders[0].value * NC + +sliders[1].value;
  const request = ++settingRequest;
  setStatus.textContent = "loading…";
  let S;
  try {
    S = await loadSetting(k);
  } catch (e) {
    setStatus.textContent = e.message;
    return;
  }
  if (request !== settingRequest) return;  // a newer slider move superseded this one
  for (const r of DATA.rows) {
    const x = S[r.ticker];
    if (!x) continue;
    r.months.forEach((m, i) => { m.r = x.r[i]; m.e = x.e[i]; m.x = x.x[i]; m.p = x.p[i]; });
    Object.assign(r, { avg: x.avg, total: x.total, trades: x.trades, open: x.open });
    prepare(r);
  }
  cur = sliders.map(el => +el.value);
  DEFAULT = k;
  renderTerms();
  render();
  renderStock();
  setStatus.textContent = "";
}
for (const el of sliders) el.addEventListener("input", () => { showSliders(); applySetting(); });
showSliders();

render();
</script>
</body>
</html>
